version: "3.9"

# Stress-testing stack: Postgres + API (multi-worker, no --reload) + Locust.
# Bring it up with:  docker compose -f docker-compose.stress.yml up --build
# Then open http://localhost:8089  or run headless (see `make stress-headless`).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    # No --reload; run multiple workers so the server can actually sustain load.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/devhub
      SECRET_KEY: stress-secret
      ALLOWED_ORIGINS: http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  locust:
    build:
      context: ./stress
    environment:
      LOCUST_HOST: http://api:8000
    ports:
      - "8089:8089"
    depends_on:
      - api
    volumes:
      - ./stress/locustfile.py:/mnt/locust/locustfile.py:ro

volumes:
  pgdata:
